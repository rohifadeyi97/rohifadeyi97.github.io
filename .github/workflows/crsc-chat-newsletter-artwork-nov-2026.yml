name: Archive CRSC newsletter supplied course artwork
on:
  push:
    branches: [crsc-maotiec-assets-2026]
    paths: [.github/workflows/crsc-chat-newsletter-artwork-nov-2026.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    env:
      CANVA_CPR: "https://media.canva.com/v2/image-resize/format:PNG/height:100/quality:100/uri:ifs%3A%2F%2FM%2Fc0c04141-1104-42ed-bc82-a2b66af377b1/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAADBnoowX6viDCpxOfUn04UD_9elem1WPmwETuXzVsaL2&exp=1793654213&osig=AAAAAAAAAAAAAAAAAAAAAMSLjafYCX31-rWj9qJc36o6LcL9LKTS4ZuOMDCSqUOJ&signer=media-rpc&token=AAIAAU0AJGMwYzA0MTQxLTExMDQtNDJlZC1iYzgyLWEyYjY2YWYzNzdiMQAAAAABoZ4fSYhfFe0i3irEpmiMNHclSAEcvyi0a3T-mPUh2M68YswPng&x-canva-quality=thumbnail"
      CANVA_OSHA502: "https://media.canva.com/v2/image-resize/format:PNG/height:100/quality:100/uri:ifs%3A%2F%2FM%2F3698437a-f9d2-4718-b714-94712fdb77ff/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAABIKY1ol-MkewbfA__F_A-hMXhq5SjOk3AcuxXq4wK0D&exp=1793652620&osig=AAAAAAAAAAAAAAAAAAAAAI38GbVjGCkO9um6oJOWqPTxz0Kol6etapQCe6UT1hhq&signer=media-rpc&token=AAIAAU0AJDM2OTg0MzdhLWY5ZDItNDcxOC1iNzE0LTk0NzEyZmRiNzdmZgAAAAABoZ4G-uCWQri24YnNovNwSYsrNihem8ILSNNC8cL4pjJMmdAF4g&x-canva-quality=thumbnail"
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve exact user-supplied Canva uploads at email-ready resolution
        run: |
          python3 - <<'PY'
          import os, pathlib, urllib.request, struct, re
          out=pathlib.Path("assets/crsc/promotions/november-2026")
          out.mkdir(parents=True,exist_ok=True)
          for code,filename in [("CPR","first-aid-nov9-user-approved.png"),("OSHA502","osha-502-nov23-25-user-approved.png")]:
              source=os.environ["CANVA_"+code]
              candidates=[]
              for width,height in [(2048,1024),(1120,560),(800,400),(632,316)]:
                  u=source.replace("/height:100/","/height:"+str(height)+"/").replace("/width:200?","/width:"+str(width)+"?")
                  candidates.append((width,u))
              chosen=None
              for w,url in candidates:
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
                      with urllib.request.urlopen(req,timeout=35) as resp: content=resp.read()
                      if content[:8]!=bytes([137,80,78,71,13,10,26,10]): raise RuntimeError("Not a PNG")
                      gotw,goth=struct.unpack(">II",content[16:24])
                      print(code,"requested",w,"received",gotw,goth,"bytes",len(content))
                      if gotw < 560 or goth < 280: raise RuntimeError("Too small for newsletter")
                      chosen=content
                      break
                  except Exception as err:
                      print(code,"variant unavailable:",type(err).__name__,str(err)[:130])
              if chosen is None: raise RuntimeError("No safe full-width Canva image variant for "+code)
              (out/filename).write_bytes(chosen)
              print("Saved",filename,len(chosen))
          PY
          git config user.name "CRSC Newsletter Assets"
          git config user.email "actions@users.noreply.github.com"
          git add assets/crsc/promotions/november-2026/
          git commit -m "Archive user-approved CRSC CPR and OSHA 502 images for November newsletter"
          git push origin HEAD:crsc-maotiec-assets-2026
