name: Import MAOTIEC Canva newsletter artwork
on:
  push:
    branches: [crsc-maotiec-assets-2026]
    paths: [.github/workflows/crsc-maotiec-assets-2026.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Save Canva PNG artwork
        env:
          CANVA_511: "https://media.canva.com/v2/document-image/hash:400816824/height:316/id:DAHYI8YmIL8/type:B/width:632?brand=BADmfU2P6IM&csig=AAAAAAAAAAAAAAAAAAAAANpAg3uyz1dapyCE8yViHphq3Ic48gvWGKBDyUzy9Zjb&exp=1792124170&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export-us1.canva.com%2FYmIL8%2FDAHYI8YmIL8%2F2%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHUBTCC4VT%252F20261015%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20261015T150028Z%26X-Amz-Expires%3D50442%26X-Amz-Signature%3Dc432a03853918da12183caba8ad3b6474c7f34789236dcd620941fd772d0cfbd%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DFri%252C%252016%2520Oct%25202026%252005%253A01%253A10%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAJgWnKUoPQEgsox5V07MYZDEotJo_I09pkFuLcMxBaz2&page=1&signed=brand%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=3"
          CANVA_500: "https://media.canva.com/v2/document-image/hash:-1833739132/height:316/id:DAHYI8YmIL8/type:B/width:632?brand=BADmfU2P6IM&csig=AAAAAAAAAAAAAAAAAAAAAI0lzVQ-1kxp2i-V_p-57UW1HDYUkarLh-XUPcFyXkn2&exp=1792124170&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export-us1.canva.com%2FYmIL8%2FDAHYI8YmIL8%2F2%2Fthumbnail%2F0002.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHUBTCC4VT%252F20261015%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20261015T194647Z%26X-Amz-Expires%3D33263%26X-Amz-Signature%3Dd5becc647e6f51156fba18485832d8b88de33cbe63226ace785fff00ba47c5bb%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DFri%252C%252016%2520Oct%25202026%252005%253A01%253A10%2520GMT&fallbackstale=T&osig=AAAAAAAAAAAAAAAAAAAAAG0TDOP7tlDKVa8TwTDqdlkPD5YN4Yd7KvsJCS08XW08&page=2&signed=brand%2Cfallback%2Cfallbackstale%2Cpage%2Cversion&signer=document-rpc&version=3"
          CANVA_2045: "https://media.canva.com/v2/document-image/hash:93591210/height:316/id:DAHYI8YmIL8/type:B/width:632?brand=BADmfU2P6IM&csig=AAAAAAAAAAAAAAAAAAAAAL3YTy4zjXLkKF-nVijATt-53j5wgm9_dE9nsXb34jjI&exp=1792124170&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export-us1.canva.com%2FYmIL8%2FDAHYI8YmIL8%2F2%2Fthumbnail%2F0003.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHUBTCC4VT%252F20261015%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20261015T180014Z%26X-Amz-Expires%3D39656%26X-Amz-Signature%3D32e84a274167bd724de04ffe05f1f35f1ecef7925d991b76991136fa082665fa%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DFri%252C%252016%2520Oct%25202026%252005%253A01%253A10%2520GMT&fallbackstale=T&osig=AAAAAAAAAAAAAAAAAAAAAPkbvZDF4xrDZsbY4KyvigvzoQbjtITi2Z7Du_Hu05gV&page=3&signed=brand%2Cfallback%2Cfallbackstale%2Cpage%2Cversion&signer=document-rpc&version=3"
          CANVA_3115: "https://media.canva.com/v2/document-image/hash:-1168845107/height:316/id:DAHYI8YmIL8/type:B/width:632?brand=BADmfU2P6IM&csig=AAAAAAAAAAAAAAAAAAAAAB8jr3rOL05wzngj0qkdtDO3tR4GZ-Jru_HZUozJ7rzt&exp=1792124170&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export-us1.canva.com%2FYmIL8%2FDAHYI8YmIL8%2F2%2Fthumbnail%2F0004.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHUBTCC4VT%252F20261016%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20261016T034514Z%26X-Amz-Expires%3D4556%26X-Amz-Signature%3Ddba17c5730d85f62a9f5482520a95e2d5a734f8c27771017b6c609760ec56085%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DFri%252C%252016%2520Oct%25202026%252005%253A01%253A10%2520GMT&fallbackstale=T&osig=AAAAAAAAAAAAAAAAAAAAAJOyxTYCctgYQdarzR_ewzCCTVbVBFuZhN3_zrvcCdo3&page=4&signed=brand%2Cfallback%2Cfallbackstale%2Cpage%2Cversion&signer=document-rpc&version=3"
        run: |
          python3 - <<'PY'
          import os, pathlib, urllib.request, urllib.parse
          out = pathlib.Path("assets/crsc/maotiec-2026")
          out.mkdir(parents=True, exist_ok=True)
          for code in ("511","500","2045","3115"):
              url = os.environ["CANVA_"+code]
              urls = [url]
              qs = urllib.parse.parse_qs(urllib.parse.urlsplit(url).query)
              if qs.get("fallback"):
                  urls.append(qs["fallback"][0])
              content = None
              for candidate in urls:
                  try:
                      req = urllib.request.Request(candidate, headers={"User-Agent":"Mozilla/5.0"})
                      with urllib.request.urlopen(req, timeout=35) as response:
                          content = response.read()
                      if content.startswith(b"\x89PNG\r\n\x1a\n"):
                          break
                      raise ValueError("Unexpected non-PNG response")
                  except Exception as err:
                      print("Retry source for", code, type(err).__name__, str(err)[:140])
                      content = None
              if not content:
                  raise RuntimeError("Could not download verified Canva art for OSHA "+code)
              path = out/("osha-"+code+".png")
              path.write_bytes(content)
              print("Saved", path, len(content), "bytes")
          PY
          git config user.name "CRSC Newsletter Assets"
          git config user.email "actions@users.noreply.github.com"
          git add assets/crsc/maotiec-2026
          git commit -m "Refresh MAOTIEC class graphics from corrected Canva designs"
          git push origin HEAD:crsc-maotiec-assets-2026
