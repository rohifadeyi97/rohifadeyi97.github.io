name: Import MAOTIEC Canva newsletter artwork
on:
  push:
    branches: [crsc-maotiec-assets-2026]
    paths: [.github/workflows/crsc-maotiec-assets-2026.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Save Canva PNG artwork
        env:
          CANVA_511: "https://media.canva.com/v2/document-image/hash:400816824/height:316/id:DAHYI8YmIL8/type:B/width:632?brand=BADmfU2P6IM&csig=AAAAAAAAAAAAAAAAAAAAALgKzNds6PgXzjJStyyqo2oW3ENYWRnZplb-Jpg84_gQ&exp=1792125083&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export-us1.canva.com%2FYmIL8%2FDAHYI8YmIL8%2F2%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHUBTCC4VT%252F20261015%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20261015T150028Z%26X-Amz-Expires%3D51355%26X-Amz-Signature%3D9b84e01beef46c2eca952d1f1f9ff1d30550139f498c3d3a94cc88be892d0223%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DFri%252C%252016%2520Oct%25202026%252005%253A16%253A23%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAP1pXlUyIdonbuCS-y32A_m5B0pI3VBmQ6N8kjI8Tz_k&page=1&signed=brand%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=4"
          CANVA_500: "https://media.canva.com/v2/document-image/hash:-1666655567/height:316/id:DAHYI8YmIL8/type:B/width:632?brand=BADmfU2P6IM&csig=AAAAAAAAAAAAAAAAAAAAAHU9Dsn7iYs44OwvHD7-XbD_2uTCDvroLX8ghGqyKee6&exp=1792125083&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export-us1.canva.com%2FYmIL8%2FDAHYI8YmIL8%2F3%2Fthumbnail%2F0002.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHUBTCC4VT%252F20261015%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20261015T055732Z%26X-Amz-Expires%3D83931%26X-Amz-Signature%3D379f195df6136d8a53a7e413f515c48602de45448d99f24653fd9fd891eadcdd%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DFri%252C%252016%2520Oct%25202026%252005%253A16%253A23%2520GMT&fallbackstale=T&osig=AAAAAAAAAAAAAAAAAAAAAJwJNXYmaJNuDKqjloEWaDGIoh9pczy47DZGqT_8Gkhw&page=2&signed=brand%2Cfallback%2Cfallbackstale%2Cpage%2Cversion&signer=document-rpc&version=4"
          CANVA_2045: "https://media.canva.com/v2/document-image/hash:93591210/height:316/id:DAHYI8YmIL8/type:B/width:632?brand=BADmfU2P6IM&csig=AAAAAAAAAAAAAAAAAAAAANn8Yz3xn0FA-tMIPlyrXivQxUlGVIqO5HkL_mCXMHbr&exp=1792125083&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export-us1.canva.com%2FYmIL8%2FDAHYI8YmIL8%2F3%2Fthumbnail%2F0003.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHUBTCC4VT%252F20261016%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20261016T031924Z%26X-Amz-Expires%3D7019%26X-Amz-Signature%3Ddbdfba3316686413d914c79dea08870688d7591acf1d26b5b905ebeb599bf570%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DFri%252C%252016%2520Oct%25202026%252005%253A16%253A23%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAElmnt82r9D2PvyeS4P2Cb0Kz0EaJdKL57jaz_m_CHd1&page=3&signed=brand%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=4"
          CANVA_3115: "https://media.canva.com/v2/document-image/hash:-1168845107/height:316/id:DAHYI8YmIL8/type:B/width:632?brand=BADmfU2P6IM&csig=AAAAAAAAAAAAAAAAAAAAADk4tF_VO2brdLNFhSYxgFXo-9pVtoP20HKddKn8yC5G&exp=1792125083&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export-us1.canva.com%2FYmIL8%2FDAHYI8YmIL8%2F3%2Fthumbnail%2F0004.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHUBTCC4VT%252F20261015%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20261015T131901Z%26X-Amz-Expires%3D57442%26X-Amz-Signature%3D6093bf83bdb19d420040494f676fa28006406cc7babaab910426808365a8ab9b%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DFri%252C%252016%2520Oct%25202026%252005%253A16%253A23%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAGodt6JGsWI1JZdIKNupkrFkpJoOHRJovaF1DXXtAWfQ&page=4&signed=brand%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=4"
        run: |
          python3 - <<'PY'
          import os, pathlib, urllib.request, urllib.parse
          out = pathlib.Path("assets/crsc/maotiec-2026")
          out.mkdir(parents=True, exist_ok=True)
          for code in ("511","500","2045","3115"):
              url = os.environ["CANVA_"+code]
              urls = [url]
              qs = urllib.parse.parse_qs(urllib.parse.urlsplit(url).query)
              if qs.get("fallback"):
                  urls.append(qs["fallback"][0])
              content = None
              for candidate in urls:
                  try:
                      req = urllib.request.Request(candidate, headers={"User-Agent":"Mozilla/5.0"})
                      with urllib.request.urlopen(req, timeout=35) as response:
                          content = response.read()
                      if content.startswith(b"\x89PNG\r\n\x1a\n"):
                          break
                      raise ValueError("Unexpected non-PNG response")
                  except Exception as err:
                      print("Retry source for", code, type(err).__name__, str(err)[:140])
                      content = None
              if not content:
                  raise RuntimeError("Could not download verified Canva art for OSHA "+code)
              path = out/("osha-"+code+".png")
              path.write_bytes(content)
              print("Saved", path, len(content), "bytes")
          PY
          git config user.name "CRSC Newsletter Assets"
          git config user.email "actions@users.noreply.github.com"
          git add assets/crsc/maotiec-2026
          git commit -m "Refresh MAOTIEC class graphics from corrected Canva designs"
          git push origin HEAD:crsc-maotiec-assets-2026
